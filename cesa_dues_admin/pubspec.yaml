name: cesa_dues_admin
description: "CESA DUES Admin Portal — HOD & Financial Secretary Management Interface"
publish_to: 'none'
version: 1.0.0+1

resolution: workspace

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # Shared core package
  cesa_dues_core:
    path: ../cesa_dues_core

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Firebase
  firebase_core: ^3.12.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.0
  cloud_functions: ^5.2.0

  # Utilities
  uuid: ^4.3.30

  # UI
  shimmer: ^3.0.0

  # File handling
  file_picker: ^8.3.7
  csv: ^6.0.0
  excel: ^4.0.6
  open_filex: ^4.5.0

  # Utilities
  intl: ^0.20.2
  url_launcher: ^6.3.2
  share_plus: ^12.0.2
  path_provider: ^2.1.6
  google_sign_in: ^6.2.1
  shared_preferences: ^2.5.5
  mobile_scanner: ^5.2.3
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/logo.jpg"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.jpg"

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.jpg
