name: cesa_dues_student
description: "CESA DUES Student App — Civil Engineering Students' Association Dues Management"
publish_to: 'none'
version: 1.0.0+1

resolution: workspace

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # Shared core package
  cesa_dues_core:
    path: ../cesa_dues_core

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Firebase
  firebase_core: ^3.12.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.4.0
  firebase_messaging: ^15.2.0

  # UI
  shimmer: ^3.0.0
  qr_flutter: ^4.1.0

  # Camera & images
  image_picker: ^1.1.2

  # Utilities
  intl: ^0.20.3
  connectivity_plus: ^6.1.3
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.2
  http: ^1.2.2
  google_sign_in: ^6.2.1
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/logo.jpg"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.jpg"

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.jpg
    - assets/images/google_logo.png
